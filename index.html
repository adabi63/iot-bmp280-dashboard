<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dashboard BMP280 Pro</title>
  <link rel="icon" href="icon.png">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #0e1117;
      --surface: #161b27;
      --surface2: #1e2538;
      --border: #252d42;
      --text: #e8eaf0;
      --muted: #6b7694;
      --accent-red: #ff6b6b;
      --accent-blue: #38bdf8;
      --accent-green: #34d399;
      --accent-yellow: #fbbf24;
      --accent-orange: #fb923c;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 16px;
      line-height: 1.5;
    }

    /* Container for desktop centering */
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 12px;
    }

    .header-left h1 {
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-left .meta {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-blue);
      box-shadow: 0 0 8px var(--accent-blue);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.8);
      }
    }

    /* ===== GRID SYSTEM ===== */
    .grid-layout {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }

    .col-12 {
      grid-column: span 12;
    }

    .col-6 {
      grid-column: span 6;
    }

    .col-4 {
      grid-column: span 4;
    }

    /* ===== CARD ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      height: 100%;
    }

    /* ===== SUHU BANNER ===== */
    .suhu-banner {
      background: linear-gradient(135deg, rgba(251, 146, 60, 0.1) 0%, rgba(251, 146, 60, 0.02) 100%);
      border: 1px solid rgba(251, 146, 60, 0.2);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .suhu-banner .main-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .suhu-banner .icon-wrap {
      width: 48px;
      height: 48px;
      background: rgba(251, 146, 60, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .suhu-banner .value {
      font-family: var(--mono);
      font-size: clamp(1.8rem, 5vw, 2.2rem);
      font-weight: 700;
      color: var(--accent-orange);
      line-height: 1;
    }

    .suhu-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: center;
      flex-grow: 1;
      max-width: 300px;
    }

    .suhu-mini .label {
      font-size: 0.6rem;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .suhu-mini .num {
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 700;
    }

    /* ===== GAUGE ===== */
    .gauge-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 260px; 
      text-align: center;
    }

    .gauge-wrapper {
      position: relative;
      width: 100%;
      max-width: 200px;
      margin: 0 auto 10px;
    }

    .gauge-svg {
      width: 100%;
      height: auto;
    }

    .gauge-value {
      position: absolute;
      bottom: 15%;
      width: 100%;
    }

    .gauge-value .num {
      font-family: var(--mono);
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 700;
      display: block;
    }

    .gauge-value .unit {
      font-size: 0.65rem;
      color: var(--muted);
    }

    .status-badge {
      width: 100%;
      padding: 6px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 12px;
    }

    .status-red {
      background: rgba(255, 107, 107, 0.1);
      color: var(--accent-red);
      border: 1px solid rgba(255, 107, 107, 0.2);
    }

    .status-blue {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .status-green {
      background: rgba(52, 211, 153, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(52, 211, 153, 0.2);
    }

    .status-orange {
      background: rgba(251, 146, 60, 0.1);
      color: var(--accent-orange);
      border: 1px solid rgba(251, 146, 60, 0.2);
    }

    /* ===== STATS ===== */
    .stat-card .label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .stat-card .val {
      font-family: var(--mono);
      font-size: 1.2rem;
      font-weight: 700;
      margin: 4px 0;
    }

    .stat-card .sub {
      font-size: 0.65rem;
      color: var(--muted);
    }

    /* ===== CHART ===== */
    .chart-header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
    }

    .chart-toggle {
      display: flex;
      background: var(--surface2);
      padding: 3px;
      border-radius: 10px;
    }

    .toggle-btn {
      padding: 6px 12px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.2s;
    }

    .toggle-btn.active {
      background: var(--accent-blue);
      color: var(--bg);
    }

    .chart-wrap {
      height: 180px;
      width: 100%;
    }

    /* ===== LOGS ===== */
    .log-list {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-item {
      background: var(--surface2);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.7rem;
      display: flex;
      gap: 10px;
    }

    /* ===== RESPONSIVE FIXES ===== */
    @media (max-width: 768px) {
      .col-md-6 {
        grid-column: span 6;
      }

      .col-md-12 {
        grid-column: span 12;
      }

      .suhu-banner {
        justify-content: center;
        text-align: center;
      }

      .suhu-mini-grid {
        max-width: 100%;
      }

      .chart-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .chart-toggle {
        width: 100%;
        justify-content: space-between;
      }

      .toggle-btn {
        flex: 1;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .col-sm-12 {
        grid-column: span 12;
      }

      .grid-layout {
        gap: 8px;
      }

      .card {
        padding: 16px;
      }

      .header-left .meta {
        display: none;
      }

      /* Hide technical meta on tiny screens */
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <h1>Dashboard BMP280</h1>
        <div class="meta">Node: 0x3A7F · I²C 0x76</div>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span> LIVE
      </div>
    </header>

    <!-- BANNER SUHU -->
    <section class="grid-layout">
      <div class="col-12">
        <div class="card suhu-banner">
          <div class="main-info">
            <div class="icon-wrap">🌡️</div>
            <div>
              <div class="suhu-mini">
                <div class="label">Suhu Udara</div>
              </div>
              <div class="value"><span id="val-suhu">--</span><span
                  style="font-size:0.5em; margin-left:4px; opacity:0.6">°C</span></div>
            </div>
          </div>
          <div class="suhu-mini-grid">
            <div class="suhu-mini">
              <div class="label">Min</div>
              <div class="num" id="suhu-min">--</div>
            </div>
            <div class="suhu-mini">
              <div class="label">Avg</div>
              <div class="num" id="suhu-avg">--</div>
            </div>
            <div class="suhu-mini">
              <div class="label">Max</div>
              <div class="num" id="suhu-max">--</div>
            </div>
          </div>
          <div class="status-badge status-orange" id="status-suhu" style="max-width:150px">(￣o￣) . z Z</div>
        </div>
      </div>
    </section>

    <!-- GAUGES -->
    <section class="grid-layout">
      <div class="col-6 col-sm-12">
        <div class="card gauge-card">
          <div class="gauge-wrapper">
            <svg class="gauge-svg" viewBox="0 0 160 110">
              <path d="M 20 95 A 70 70 0 1 1 140 95" fill="none" stroke="#252d42" stroke-width="10"
                stroke-linecap="round" />
              <path id="gauge-arc-tekanan" d="M 20 95 A 70 70 0 1 1 140 95" fill="none" stroke="#ff6b6b"
                stroke-width="10" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="220"
                style="transition:0.8s" />
            </svg>
            <div class="gauge-value">
              <span class="num" id="val-tekanan">--</span>
              <span class="unit">hPa</span>
            </div>
          </div>
          <div class="status-badge status-red" id="status-tekanan">Tekanan Udara</div>
        </div>
      </div>
      <div class="col-6 col-sm-12">
        <div class="card gauge-card">
          <div class="gauge-wrapper">
            <svg class="gauge-svg" viewBox="0 0 160 110">
              <path d="M 20 95 A 70 70 0 1 1 140 95" fill="none" stroke="#252d42" stroke-width="10"
                stroke-linecap="round" />
              <path id="gauge-arc-altitude" d="M 20 95 A 70 70 0 1 1 140 95" fill="none" stroke="#38bdf8"
                stroke-width="10" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="220"
                style="transition:0.8s" />
            </svg>
            <div class="gauge-value">
              <span class="num" id="val-altitude">--</span>
              <span class="unit">cm</span>
            </div>
          </div>
          <div class="status-badge status-blue" id="status-altitude">Level Air</div>
        </div>
      </div>
    </section>

    <!-- STATS -->
    <section class="grid-layout">
      <div class="col-4 col-md-12">
        <div class="card stat-card">
          <div class="label">Min Tekanan</div>
          <div class="val" id="stat-min">--</div>
          <div class="sub">Sesi ini (hPa)</div>
        </div>
      </div>
      <div class="col-4 col-md-6 col-sm-12">
        <div class="card stat-card">
          <div class="label">Rata-rata</div>
          <div class="val" id="stat-avg">--</div>
          <div class="sub" id="stat-avg-sub">0 sampel</div>
        </div>
      </div>
      <div class="col-4 col-md-6 col-sm-12">
        <div class="card stat-card">
          <div class="label">Max Tekanan</div>
          <div class="val" id="stat-max">--</div>
          <div class="sub">Puncak (hPa)</div>
        </div>
      </div>
    </section>

    <!-- CHART -->
    <section class="grid-layout">
      <div class="col-12">
        <div class="card">
          <div class="chart-header">
            <h3 style="font-size:0.9rem">Grafik Real-time</h3>
            <div class="chart-toggle">
              <button class="toggle-btn active" onclick="setChart('tekanan', this)">P</button>
              <button class="toggle-btn" onclick="setChart('level_air', this)">Level</button>
              <button class="toggle-btn" onclick="setChart('suhu', this)">Temp</button>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="chart"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- FOOTER INFO & LOGS -->
    <section class="grid-layout">
      <div class="col-6 col-md-12">
        <div class="grid-layout" style="margin:0">
          <div class="col-6 card" style="padding:12px; display:flex; align-items:center; gap:10px">
            <span style="color:var(--accent-blue)">💠</span>
            <div>
              <div style="font-size:0.6rem; color:var(--muted)">RESOLUSI</div>
              <div style="font-size:0.8rem; font-weight:700">0.01 hPa</div>
            </div>
          </div>
          <div class="col-6 card" style="padding:12px; display:flex; align-items:center; gap:10px">
            <span style="color:var(--accent-orange)">⏱️</span>
            <div>
              <div style="font-size:0.6rem; color:var(--muted)">UPTIME</div>
              <div id="val-uptime" style="font-size:0.8rem; font-weight:700">0m 0s</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-12">
        <div class="card">
          <div style="font-size:0.8rem; font-weight:700; margin-bottom:10px">Log Aktivitas</div>
          <div class="log-list" id="log-list"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBdtxpQLAv3hdsLRZu48AL9Vi6i1iWcwIY",
      authDomain: "tubes-iot-bmp280.firebaseapp.com",
      databaseURL: "https://tubes-iot-bmp280-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tubes-iot-bmp280",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let pressureHistory = [], levelHistory = [], tempHistory = [];
    let minP = Infinity, maxP = -Infinity, sumP = 0, countP = 0;
    let minS = Infinity, maxS = -Infinity, sumS = 0, countS = 0;
    let chartMode = 'tekanan';
    let uptimeStart = Date.now();

    // Chart Setup
    const ctx = document.getElementById('chart').getContext('2d');
    const chartInst = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          data: [],
          borderColor: '#38bdf8',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.4,
          fill: true,
          backgroundColor: 'rgba(56,189,248,0.1)'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { display: false },
          y: { grid: { color: '#252d42' }, ticks: { color: '#6b7694', font: { size: 10 } } }
        }
      }
    });

    window.setChart = (mode, btn) => {
      chartMode = mode;
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateChart();
    };

    function updateChart() {
      const config = {
        tekanan: { data: pressureHistory, color: '#ff6b6b' },
        level_air: { data: levelHistory, color: '#38bdf8' },
        suhu: { data: tempHistory, color: '#fb923c' }
      }[chartMode];

      chartInst.data.labels = config.data.map(() => '');
      chartInst.data.datasets[0].data = config.data;
      chartInst.data.datasets[0].borderColor = config.color;
      chartInst.data.datasets[0].backgroundColor = config.color + '22';
      chartInst.update('none');
    }

    function setGauge(id, value, min, max) {
      const arc = document.getElementById('gauge-arc-' + id);
      const frac = Math.min(1, Math.max(0, (value - min) / (max - min)));
      arc.style.strokeDashoffset = 220 * (1 - frac);
    }

    function addLog(msg) {
      const list = document.getElementById('log-list');
      const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerHTML = `<span style="color:var(--muted)">${time}</span> <span>${msg}</span>`;
      list.prepend(item);
      if (list.children.length > 5) list.lastChild.remove();
    }

    onValue(ref(db, "sensor"), (snap) => {
      const data = snap.val();
      if (!data) return;

      const p = parseFloat(data.tekanan);
      const s = parseFloat(data.suhu);
      const level = parseFloat(data.level_air);

      // Updates
      document.getElementById('val-suhu').innerText = s.toFixed(1);
      document.getElementById('val-tekanan').innerText = p.toFixed(0);
      document.getElementById('val-altitude').innerText = level.toFixed(1);

      // Stats Temp
      if (s < minS) minS = s; if (s > maxS) maxS = s; sumS += s; countS++;
      document.getElementById('suhu-min').innerText = minS.toFixed(1);
      document.getElementById('suhu-max').innerText = maxS.toFixed(1);
      document.getElementById('suhu-avg').innerText = (sumS / countS).toFixed(1);

      // Stats Pressure
      if (p < minP) minP = p; if (p > maxP) maxP = p; sumP += p; countP++;
      document.getElementById('stat-min').innerText = minP.toFixed(1);
      document.getElementById('stat-max').innerText = maxP.toFixed(1);
      document.getElementById('stat-avg').innerText = (sumP / countP).toFixed(1);
      document.getElementById('stat-avg-sub').innerText = `${countP} sampel`;

      setGauge('tekanan', p, 950, 1050);
      setGauge('altitude', level, 0, 95);

      pressureHistory.push(p);
      levelHistory.push(level);
      tempHistory.push(s);
      if (pressureHistory.length > 30) {
        pressureHistory.shift();
        levelHistory.shift();
        tempHistory.shift();
      }
      updateChart();
    });

    setInterval(() => {
      const sec = Math.floor((Date.now() - uptimeStart) / 1000);
      document.getElementById('val-uptime').innerText = `${Math.floor(sec / 60)}m ${sec % 60}s`;
    }, 1000);

    addLog("Sistem Online");
  </script>
</body>

</html>
